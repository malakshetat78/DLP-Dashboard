version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: dlp_database
    environment:
      POSTGRES_DB: dlp_system
      POSTGRES_USER: dlp_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - dlp_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dlp_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (للـ Caching والجلسات)
  redis:
    image: redis:7-alpine
    container_name: dlp_redis
    ports:
      - "6379:6379"
    networks:
      - dlp_network
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes:
      - redis_data:/data

  # Backend API (Flask)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dlp_backend
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - DATABASE_URL=postgresql://dlp_user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/dlp_system
      - REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
      - UPLOAD_FOLDER=/app/encrypted_storage
    volumes:
      - ./backend:/app
      - encrypted_files:/app/encrypted_storage
      - encryption_keys:/app/keys
      - logs:/app/logs
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - dlp_network
    restart: unless-stopped
    command: gunicorn -w 4 -b 0.0.0.0:5000 app:app --timeout 120

  # Frontend (React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dlp_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - dlp_network
    restart: unless-stopped

  # Nginx Reverse Proxy (Optional - للإنتاج)
  nginx:
    image: nginx:alpine
    container_name: dlp_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - dlp_network
    restart: unless-stopped

  # Celery Worker (للمهام الخلفية - Optional)
  # celery_worker:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   container_name: dlp_celery_worker
  #   command: celery -A app.celery worker --loglevel=info
  #   environment:
  #     - DATABASE_URL=postgresql://dlp_user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/dlp_system
  #     - REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
  #   depends_on:
  #     - db
  #     - redis
  #   networks:
  #     - dlp_network
  #   restart: unless-stopped

  # Prometheus (للمراقبة - Optional)
  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: dlp_prometheus
  #   volumes:
  #     - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
  #     - prometheus_data:/prometheus
  #   ports:
  #     - "9090:9090"
  #   networks:
  #     - dlp_network
  #   restart: unless-stopped

  # Grafana (للتصورات - Optional)
  # grafana:
  #   image: grafana/grafana:latest
  #   container_name: dlp_grafana
  #   environment:
  #     - GF_SECURITY_ADMIN_PASSWORD=admin_password_change_this
  #   volumes:
  #     - grafana_data:/var/lib/grafana
  #   ports:
  #     - "3001:3000"
  #   depends_on:
  #     - prometheus
  #   networks:
  #     - dlp_network
  #   restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  encrypted_files:
    driver: local
  encryption_keys:
    driver: local
  logs:
    driver: local
  # prometheus_data:
  #   driver: local
  # grafana_data:
  #   driver: local

networks:
  dlp_network:
    driver: bridge